<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#fefefe"/>
  <rect x="50" y="50" width="700" height="500" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Forensic analysis illustration -->
  <rect x="150" y="200" width="200" height="150" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="250" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">Evidence Analysis</text>
  
  <!-- Evidence items -->
  <rect x="170" y="240" width="30" height="20" fill="#fbbf24" opacity="0.7" rx="2"/>
  <text x="185" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#92400e">Debris</text>
  
  <rect x="210" y="240" width="30" height="20" fill="#ef4444" opacity="0.7" rx="2"/>
  <text x="225" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#991b1b">Fluid</text>
  
  <rect x="250" y="240" width="30" height="20" fill="#3b82f6" opacity="0.7" rx="2"/>
  <text x="265" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1d4ed8">Paint</text>
  
  <!-- Analysis arrows -->
  <path d="M 170 280 L 190 300 L 170 320" fill="none" stroke="#6b7280" stroke-width="2"/>
  <path d="M 210 280 L 230 300 L 210 320" fill="none" stroke="#6b7280" stroke-width="2"/>
  <path d="M 250 280 L 270 300 L 250 320" fill="none" stroke="#6b7280" stroke-width="2"/>
  
  <!-- Results box -->
  <rect x="400" y="200" width="250" height="150" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="525" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#047857">Reconstruction Results</text>
  
  <text x="420" y="245" font-family="Arial, sans-serif" font-size="10" fill="#065f46">• Impact Speed: 45 mph</text>
  <text x="420" y="265" font-family="Arial, sans-serif" font-size="10" fill="#065f46">• Impact Angle: 32°</text>
  <text x="420" y="285" font-family="Arial, sans-serif" font-size="10" fill="#065f46">• Braking Distance: 78 ft</text>
  <text x="420" y="305" font-family="Arial, sans-serif" font-size="10" fill="#065f46">• Time to Impact: 2.1 sec</text>
  <text x="420" y="325" font-family="Arial, sans-serif" font-size="10" fill="#065f46">• Confidence: 95%</text>
  
  <text x="400" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#374151">
    Forensic Analysis
  </text>
  <text x="400" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">
    Evidence-Based Reconstruction
  </text>
  
  <text x="400" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af">
    Scientific Investigation Methods
  </text>
  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af">
    Expert Witness Testimony
  </text>
</svg>