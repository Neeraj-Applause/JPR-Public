<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#f1f5f9"/>
  <rect x="50" y="50" width="700" height="500" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Road safety workshop illustration -->
  <rect x="200" y="200" width="400" height="200" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
  <text x="400" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#374151">Road Safety Workshop</text>
  
  <!-- Workshop participants (circles) -->
  <circle cx="250" cy="260" r="15" fill="#3b82f6" opacity="0.3"/>
  <circle cx="300" cy="260" r="15" fill="#3b82f6" opacity="0.3"/>
  <circle cx="350" cy="260" r="15" fill="#3b82f6" opacity="0.3"/>
  <circle cx="450" cy="260" r="15" fill="#3b82f6" opacity="0.3"/>
  <circle cx="500" cy="260" r="15" fill="#3b82f6" opacity="0.3"/>
  <circle cx="550" cy="260" r="15" fill="#3b82f6" opacity="0.3"/>
  
  <!-- Training materials -->
  <rect x="220" y="320" width="60" height="40" fill="#fbbf24" opacity="0.4" rx="4"/>
  <text x="250" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#92400e">Materials</text>
  
  <rect x="320" y="320" width="60" height="40" fill="#ef4444" opacity="0.4" rx="4"/>
  <text x="350" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#991b1b">Data</text>
  
  <rect x="420" y="320" width="60" height="40" fill="#10b981" opacity="0.4" rx="4"/>
  <text x="450" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#047857">Results</text>
  
  <rect x="520" y="320" width="60" height="40" fill="#8b5cf6" opacity="0.4" rx="4"/>
  <text x="550" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6b21a8">Reports</text>
  
  <text x="400" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#374151">
    Training & Workshops
  </text>
  <text x="400" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">
    Road Safety Data Collection
  </text>
  
  <text x="400" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af">
    Capacity Building Programs
  </text>
  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af">
    Data-driven Safety Improvements
  </text>
</svg>