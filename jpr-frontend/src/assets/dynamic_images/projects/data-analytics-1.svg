<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#f8fafc"/>
  <rect x="50" y="50" width="700" height="500" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Data visualization elements -->
  <rect x="150" y="200" width="200" height="150" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="250" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">Traffic Data Analysis</text>
  
  <!-- Bar chart -->
  <rect x="170" y="240" width="20" height="60" fill="#3b82f6" opacity="0.7"/>
  <rect x="200" y="250" width="20" height="50" fill="#3b82f6" opacity="0.7"/>
  <rect x="230" y="230" width="20" height="70" fill="#3b82f6" opacity="0.7"/>
  <rect x="260" y="245" width="20" height="55" fill="#3b82f6" opacity="0.7"/>
  <rect x="290" y="235" width="20" height="65" fill="#3b82f6" opacity="0.7"/>
  
  <!-- Data points and connections -->
  <circle cx="400" cy="250" r="4" fill="#ef4444"/>
  <circle cx="450" cy="280" r="4" fill="#ef4444"/>
  <circle cx="500" cy="220" r="4" fill="#ef4444"/>
  <circle cx="550" cy="260" r="4" fill="#ef4444"/>
  
  <line x1="400" y1="250" x2="450" y2="280" stroke="#ef4444" stroke-width="2"/>
  <line x1="450" y1="280" x2="500" y2="220" stroke="#ef4444" stroke-width="2"/>
  <line x1="500" y1="220" x2="550" y2="260" stroke="#ef4444" stroke-width="2"/>
  
  <!-- Analytics results -->
  <rect x="400" y="320" width="250" height="100" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="525" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#047857">Analysis Results</text>
  
  <text x="420" y="360" font-family="Arial, sans-serif" font-size="10" fill="#065f46">• Accident Reduction: 25%</text>
  <text x="420" y="380" font-family="Arial, sans-serif" font-size="10" fill="#065f46">• Safety Improvement: 40%</text>
  <text x="420" y="400" font-family="Arial, sans-serif" font-size="10" fill="#065f46">• Data Quality: 95%</text>
  
  <text x="400" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#374151">
    Data Analytics
  </text>
  <text x="400" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">
    Traffic Safety Data Analysis
  </text>
  
  <text x="400" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af">
    Statistical Analysis & Reporting
  </text>
  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af">
    Policy Recommendations
  </text>
</svg>